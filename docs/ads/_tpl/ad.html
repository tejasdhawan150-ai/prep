<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:J;src:url('/assets/fonts/jakarta.woff2')}@font-face{font-family:I;src:url('/assets/fonts/inter.woff2')}
*{box-sizing:border-box;margin:0}body{width:var(--w);height:var(--h);font-family:I;overflow:hidden}
.c{width:100%;height:100%;background:linear-gradient(160deg,#1A56DB 0%,#123B9C 60%,#0B1B33 100%);color:#fff;display:flex;flex-direction:column;padding:var(--p)}
.top{display:flex;align-items:center;gap:0;font-family:J;font-weight:800;font-size:44px}.top img{width:58px}.top span{color:#93B4F5}
.eye{margin-top:var(--g);display:inline-block;align-self:flex-start;background:rgba(255,255,255,.14);border-radius:99px;padding:10px 22px;font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
h1{font-family:J;font-weight:800;font-size:var(--hs);line-height:1.08;letter-spacing:-.02em;margin-top:22px}h1 em{font-style:normal;color:#FCD34D}
.card{margin-top:var(--g);background:#fff;border-radius:28px;padding:20px;box-shadow:0 30px 60px rgba(0,0,0,.35);flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
.card img{width:100%;height:100%;object-fit:contain;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:var(--g)}.chips b{background:rgba(255,255,255,.14);border-radius:99px;padding:10px 20px;font-size:26px;font-weight:600}
.cta{margin-top:22px;background:#22C55E;color:#fff;border-radius:18px;padding:22px;text-align:center;font-family:J;font-weight:800;font-size:36px}
.small{margin-top:12px;text-align:center;font-size:22px;color:#BFDBFE}
</style></head><body><div class="c">
<div class="top"><img src="/assets/img/mark-white.svg" style="margin-right:16px">Prep<span>Eve</span></div>
<div class="eye" id="eye"></div><h1 id="h"></h1>
<div class="card"><img id="img"></div>
<div class="chips"><b>Free</b><b>Live online</b><b>Sat &amp; Sun · 7 PM IST</b><b>60 min</b></div>
<div class="cta">Reserve your free seat →</div><div class="small" id="sm"></div>
</div><script>const q=new URLSearchParams(location.search);document.getElementById('eye').textContent=q.get('e');document.getElementById('h').innerHTML=q.get('h');document.getElementById('img').src=q.get('i');document.getElementById('sm').textContent=q.get('s');</script></body></html>
